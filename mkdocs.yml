site_name: jkent
site_description: A scraper-driver framework for structured web scraping.
repo_url: https://github.com/freelawproject/jkent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

# Portability note: this project may migrate docs to a wiki. Keep the
# extension list minimal and avoid anything that rewrites link syntax or
# pulls content in from outside the page -- no snippets, no mkdocstrings,
# no mkdocs-only cross-reference syntax. Pages must stay readable as plain
# markdown with relative .md links.
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

strict: true

nav:
  - "Home": index.md
  - For scraper writers:
      - writing/index.md
      - Tutorials:
          - writing/tutorials/index.md
          - "Your first scraper": writing/tutorials/01-your-first-scraper.md
          - "Following links across pages": writing/tutorials/02-following-links.md
          - "Submitting a form": writing/tutorials/03-forms-and-navigation.md
