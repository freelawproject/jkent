# Docstring-rule baseline for ruff. Generated 2026-11-03; NOT policy.
#
# Each line freezes the D/DOC rules a file was already breaking when those
# rules were switched on: 223 findings across 41 files, 94 file/rule pairs.
# The gate catches new breakage while this backlog is burned down.
#
# Read by pyproject.toml via `[tool.ruff] extend = ".ruff-baseline.toml"`.
# The filename matters: ruff auto-discovers `ruff.toml` and `.ruff.toml`
# and either would override pyproject wholesale, so this file must NOT be
# named either of those. It is inert unless `extend` names it.
#
# Shrink this file; never add to it. Fixing a file means deleting its line.
# Granularity is per file, so a second violation of a rule already listed
# for that file slips through -- the cost of a file-level baseline. Ruff
# does not report stale entries either, so an entry outlives its findings
# until someone regenerates: empty the table below, run
#   uv run ruff check --output-format json jkent/
# and rebuild it from what that reports.

