name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The local `pyrefly` and `zuban` hooks shell out to `uv` / `uvx`, so uv
      # must be on PATH for pre-commit to invoke them.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `pytest` runs as its own job in tests.yml with proper matrix and
      # reporting; skip it here to avoid running the suite twice.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest

  # Compiles every .py file under each supported Python version. Catches
  # version-specific syntax (e.g. `except*` on 3.10) that ruff's parser
  # accepts regardless of target-version. No deps installed — just the
  # stdlib parser.
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile all sources
        run: python -m compileall -q jkent tests

  static-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      - name: Install uv # this is for the benefit of pyrefly, which is invoked locally, by pre-commit.
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.9.x"
      - name: Install dependencies # eager synchronization keeps the output of subsequent `uv` usage by pre-commit clean.
        run: uv sync
      - name: pyrefly Static Type Checker
        run: uv run pyrefly check --error-stale-baseline --output-format full-text-with-github

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
