ci:
  autoupdate_schedule: quarterly
  # pyrefly needs the project environment (uv); pre-commit.ci can't provide
  # it. The Lint workflow runs the same check.
  skip: [ pyrefly ]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
     - id: check-added-large-files
     - id: check-ast
     - id: check-json
     - id: check-merge-conflict
     - id: check-toml
     - id: check-yaml
     - id: debug-statements
     - id: detect-private-key
     - id: fix-byte-order-marker
     - id: fix-encoding-pragma
       args: [--remove]
     - id: trailing-whitespace
       args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The typed third-party libraries the code narrows against; without
        # them mypy sees `Any` and checks a weaker program than the venv does.
        additional_dependencies:
          - types-lxml
          - pydantic>=2.12.5
          - sqlalchemy[asyncio]>=2.0

  - repo: local
    hooks:
      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check --prune-baseline
        language: system
        pass_filenames: false
        files: '(\.py$|^pyrefly\.toml$|^\.pyrefly-baseline\.json$)'
      - id: zuban
        name: zuban
        # Run via uvx in an isolated env so zuban stays out of the project
        # venv/uv.lock; `uv sync` first so the venv's site-packages exist for
        # third-party import resolution on a fresh CI checkout.
        entry: bash -c 'uv sync --quiet && uvx zuban@0.8.2 check'
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -x -q -n auto
        language: system
        pass_filenames: false
        always_run: true
